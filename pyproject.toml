[project]
name = "tinyic-workspace"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "tinyic",
    "tinytroupe",
]

[tool.uv.workspace]
members = ["src/tinytroupe", "src/tinyic"]

[tool.uv.sources]
tinytroupe = { workspace = true }
tinyic = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live_api: tests that require live network/provider credentials or runtimes",
]
timeout = 120
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning:edgar.files.*:",
    "ignore::DeprecationWarning:edgar._markdown:",
    "ignore::DeprecationWarning:edgar._filings:",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-timeout>=2.4.0",
    "pytest-asyncio>=0.24",
    "python-dotenv>=1.2.2",
]
