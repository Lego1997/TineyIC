[project]
name = "tinyic"
version = "0.1.0"
requires-python = ">=3.12"
classifiers = [
    "Private :: Do Not Upload",
]
dependencies = [
    "tinytroupe",
    "python-dotenv",
    "yfinance>=1.2.0",
    "edgartools>=5.25.1",
    "streamlit>=1.40.0",
    "textual>=0.60",
]

[project.scripts]
tinyic = "tinyic.cli:main"

[tool.uv.sources]
tinytroupe = { workspace = true }

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tinyic", "tinyic.personas", "tinyic.data", "tinyic.debate", "tinyic.models", "tinyic.models.adapters", "tinyic.ui", "tinyic.tui"]

[tool.setuptools.package-dir]
tinyic = "."

[tool.setuptools.package-data]
"tinyic.personas" = ["configs/*.agent.json"]
